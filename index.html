
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>🌦️ Weather Dashboard</h1>
        <p>Discover the weather in your city</p>

        <form id="weatherForm">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
                aria-label="City name"
                required
            >
            <button type="submit">Search</button>
        </form>

        <p id="message" role="status">Search for a city to begin.</p>

        <section id="weatherResult" class="weather-card" hidden>
            <h2 id="cityName"></h2>
            <p class="temperature" id="temperature"></p>

            <div class="weather-details">
                <div>
                    <span>💧 Humidity</span>
                    <h3 id="humidity"></h3>
                </div>

                <div>
                    <span>💨 Wind Speed</span>
                    <h3 id="windSpeed"></h3>
                </div>
            </div>

            <p id="updatedTime"></p>
        </section>

        <footer>Weather data provided by Open-Meteo</footer>
    </main>
</body>
</html>
